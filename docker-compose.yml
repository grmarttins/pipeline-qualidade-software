services:
  db:
    image: postgres:18.6
    container_name: pg18-pipeline-qualidade-software
    restart: always
    volumes:
      - pgdata18:/var/lib/postgresql # volume nomeado: o Docker guarda e você não vê a pasta.
      - ./init:/docker-entrypoint-initdb.d # bind mount: liga uma pasta do seu projeto a uma pasta do container.
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_DB: ${PG_DB}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - 5432:5432
    healthcheck: # informa ao Docker como testar um contêiner para verificar se ele ainda está funcionando.
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  pgdata18:
